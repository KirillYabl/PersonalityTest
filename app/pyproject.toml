[project]
name = "Personality_test"
version = "1.0.0"
description = "Personality test"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.17.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "click>=8.1.8",
    "fastapi[standard]>=0.115.6",
    "jinja2>=3.1.5",
    "loguru>=0.7.3",
    "polyfactory>=2.18.1",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.7.0",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.36",
    "telegram-webapp-auth>=2.0.1",
    "uvloop>=0.21.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "pycln>=2.5.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-env>=1.1.5",
    "ruff>=0.9.1",
]

[tool.ruff]
target-version = "py311"
line-length = 120
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.black]
line-length = 120
target-version = ['py311']
exclude = '''
/(
  \.eggs
  |\.git
  |\.hg
  |\.mypy_cache
  |\.nox
  |\.tox
  |\.venv
  |\.pyc
  |\.pyi
)/
'''

[tool.isort]
profile = "black"
py_version = 311
line_length = 120
skip = [
    "__pycache__",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning:.*test_tables.*"
]
