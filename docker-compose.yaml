services:
  db:
    image: postgres:17-bookworm
    env_file:
      - ./app/core/.env
    ports:
      - "5332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./app/.
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      - db
    env_file:
      - ./app/core/.env

volumes:
  postgres_data:
