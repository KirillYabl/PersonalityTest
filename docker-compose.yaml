services:
  db: &db
    image: postgres:17-bookworm
    env_file:
      - ./app/core/.env
    ports:
      - "5332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app: &app
    build:
      context: ./app/.
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
    depends_on:
      - db
    env_file:
      - ./app/core/.env
    environment:
      DB_LABEL: "db"

  test-db:
    <<: *db
    ports:
      - "6332:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data

  test-app:
    <<: *app
    depends_on:
      - test-db
    env_file:
      - ./app/core/.env
    environment:
      STAND: "test"
      DB_LABEL: "test-db"

volumes:
  postgres_data:
  test_postgres_data:
